# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Ha-Myung Park
email: hmpark@kookmin.ac.kr
description: >
  Ha-Myung Park, Associate Professor at Kookmin University's School of Artificial Intelligence.
  Research in efficient data mining, scalable graph algorithms, similarity search, and AI model compression.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://hmpark.me" # the base hostname & protocol for your site
#twitter_username: Taffyer 
github_username:  jangunmp1

# Build settings
markdown: kramdown
kramdown:
  input: GFM

# Third-party services
# just leave someone empty to disable it
# google_analytics: 
disqus_shortname:

# used this for post_excerpt at index_page
excerpt_separator: <!--description-->

# Keep theme examples and source-only documentation out of the published site.
exclude:
  - ttt.md
  - index.backup.html
  - README.md
